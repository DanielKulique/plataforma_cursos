services:
  app:
    environment:
      APP_ENV: staging
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
      EMAIL_VERIFICATION_TTL_MINUTES: ${EMAIL_VERIFICATION_TTL_MINUTES:-10}
      EMAIL_PROVIDER_TIMEOUT_MS: ${EMAIL_PROVIDER_TIMEOUT_MS:-10000}
      EMAIL_VERIFICATION_RATE_LIMIT_WINDOW_MS: ${EMAIL_VERIFICATION_RATE_LIMIT_WINDOW_MS:-900000}
      EMAIL_CODE_SEND_IP_RATE_LIMIT_MAX: ${EMAIL_CODE_SEND_IP_RATE_LIMIT_MAX:-20}
      EMAIL_CODE_SEND_IDENTITY_RATE_LIMIT_MAX: ${EMAIL_CODE_SEND_IDENTITY_RATE_LIMIT_MAX:-5}
      EMAIL_CODE_VERIFY_IP_RATE_LIMIT_MAX: ${EMAIL_CODE_VERIFY_IP_RATE_LIMIT_MAX:-60}
      EMAIL_CODE_VERIFY_IDENTITY_RATE_LIMIT_MAX: ${EMAIL_CODE_VERIFY_IDENTITY_RATE_LIMIT_MAX:-10}
      STAGING_DEMO_PASSWORD: ${STAGING_DEMO_PASSWORD}
    volumes:
      - ${BACKUP_DIR:-/var/backups/plataforma-cursos}:/app/backup-status:ro

  caddy:
    environment:
      APP_PORT: ${APP_PORT:-3000}
      ACME_EMAIL: ${ACME_EMAIL}
      STAGING_BASIC_AUTH_USER: ${STAGING_BASIC_AUTH_USER}
      STAGING_BASIC_AUTH_HASH: ${STAGING_BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
