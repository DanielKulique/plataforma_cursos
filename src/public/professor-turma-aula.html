<!DOCTYPE html><html lang="pt-BR"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Detalhe da aula — Plágio</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Work+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/layouts.css"><link rel="stylesheet" href="/css/responsive.css"><link rel="stylesheet" href="/css/utilities.css">
</head><body class="academic-page academic-page--teacher teacher-class-page" data-session-state="loading" data-session-protected data-teacher-section="aula">
<a class="skip-link" href="#conteudo-principal">Pular para o conteúdo</a><div data-academic-header="teacher" data-current-area="teacher"></div><main class="academic-main" id="conteudo-principal" tabindex="-1"><div id="breadcrumbs"></div><section class="academic-panel course-masthead" aria-labelledby="turma-title"><div><h1 id="turma-title">Carregando turma...</h1><p id="curso-title"></p><p class="course-masthead__meta"><span id="periodo-turma"></span><span id="status-turma" class="badge badge--neutral">Carregando</span></p></div></section><div id="teacher-navigation" class="course-navigation-host"></div>
  <section class="academic-panel" aria-labelledby="titulo-aula"><header class="academic-panel__header academic-panel__header--actions"><div><h2 id="titulo-aula">Carregando aula...</h2><p id="descricao-aula"></p></div><div class="card-actions"><button id="novo-conteudo" type="button" class="btn btn-primary" disabled>Novo conteúdo</button><a id="nova-avaliacao" class="action-button action-button--ghost">Nova avaliação</a></div></header><p id="mensagem-conteudos" class="ui-message is-info" role="status" aria-live="polite">Carregando conteúdos.</p><ol id="lista-conteudos" class="summary-list" aria-busy="true"><li class="ui-state is-loading">Carregando...</li></ol></section>
</main>
<dialog id="modal-conteudo" class="academic-dialog academic-dialog--wide" aria-labelledby="titulo-modal-conteudo"><div class="academic-dialog__header"><h2 id="titulo-modal-conteudo">Novo conteúdo</h2><button type="button" class="academic-dialog__close" data-close-dialog aria-label="Fechar">×</button></div><p id="erro-modal-conteudo" class="ui-message is-error" role="alert" aria-live="assertive" hidden></p><form id="form-conteudo" class="academic-dialog__form"><div class="academic-form-grid"><div class="form-group academic-form-grid__wide"><label for="conteudo-titulo">Título</label><input id="conteudo-titulo" maxlength="255" required></div><div class="form-group"><label for="conteudo-tipo">Tipo</label><select id="conteudo-tipo"><option value="TEXTO">Texto</option><option value="VIDEO">Vídeo do YouTube</option><option value="PDF">PDF protegido</option><option value="LINK">Link permitido</option><option value="ATIVIDADE">Atividade</option></select></div><div class="form-group"><label for="conteudo-ordem">Ordem</label><input id="conteudo-ordem" type="number" min="0" step="1" required></div><div class="form-group"><label for="conteudo-duracao">Duração em minutos</label><input id="conteudo-duracao" type="number" min="0" step="1"></div><div class="form-group academic-form-grid__wide"><label for="conteudo-descricao">Descrição</label><textarea id="conteudo-descricao" maxlength="5000" rows="3"></textarea></div><div id="grupo-url" class="form-group academic-form-grid__wide" hidden><label for="conteudo-url">URL</label><input id="conteudo-url" maxlength="1000"></div><div id="grupo-arquivo" class="form-group academic-form-grid__wide" hidden><label for="conteudo-arquivo">Arquivo PDF</label><input id="conteudo-arquivo" type="file" accept="application/pdf,.pdf" data-max-bytes="20971520"><small>PDF de até 20 MB em armazenamento privado.</small><p id="arquivo-atual"></p></div><div id="grupo-corpo" class="form-group academic-form-grid__wide"><label for="conteudo-corpo">Texto do conteúdo</label><textarea id="conteudo-corpo" rows="6"></textarea></div></div><div class="academic-dialog__actions"><button id="salvar-conteudo" type="submit" class="btn btn-primary">Salvar conteúdo</button><button type="button" class="btn btn-ghost" data-close-dialog>Cancelar</button></div></form></dialog>
<script type="module" src="/js/academic-area.js"></script><script type="module" src="/js/theme.js"></script><script type="module" src="/js/navigation.js"></script><script type="module" src="/js/professor-turma-aula.js"></script></body></html>
