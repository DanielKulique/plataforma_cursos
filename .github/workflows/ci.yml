name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: plataforma_cursos_test
          MYSQL_USER: appuser
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports: ['33307:3306']
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 33307
      DB_USER: appuser
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      DB_NAME: plataforma_cursos_test
      DB_ENVIRONMENT_IDENTITY: plataforma_cursos_test
      ALLOW_EPHEMERAL_CI_MYSQL: I_UNDERSTAND_EPHEMERAL_CI_MYSQL
      CI_EPHEMERAL_MYSQL_ID: plataforma-cursos-ci-${{ github.run_id }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      TEST_SEED_PASSWORD: ${{ secrets.CI_TEST_SEED_PASSWORD }}
      MOTOR_IA_INTERNAL_API_TOKEN: ci-ephemeral-internal-token
      MOTOR_IA_API_URL: http://127.0.0.1:8000
      DETECTOR_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Aguardar MySQL
        run: |
          node <<'NODE'
          const mysql = require('mysql2/promise');

          async function waitForMySql() {
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              try {
                const connection = await mysql.createConnection({
                  host: process.env.DB_HOST,
                  port: Number(process.env.DB_PORT),
                  user: process.env.DB_USER,
                  password: process.env.DB_PASSWORD
                });
                await connection.end();
                return;
              } catch (error) {
                if (attempt === 30) {
                  throw error;
                }
                await new Promise((resolve) => setTimeout(resolve, 2000));
              }
            }
          }

          waitForMySql().catch((error) => {
            console.error(`MySQL não ficou disponível: ${error.code || 'UNEXPECTED_ERROR'}`);
            process.exit(1);
          });
          NODE
      - name: Habilitar triggers no MySQL efêmero
        env:
          DB_USER: root
          DB_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
        run: |
          node <<'NODE'
          const mysql = require('mysql2/promise');

          async function configureEphemeralMySql() {
            const connection = await mysql.createConnection({
              host: process.env.DB_HOST,
              port: Number(process.env.DB_PORT),
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD
            });
            try {
              await connection.query('SET GLOBAL log_bin_trust_function_creators = 1');
              // Only this disposable CI account observes lock waits in concurrency tests.
              await connection.query("GRANT SELECT ON performance_schema.data_lock_waits TO 'appuser'@'%'");
            } finally {
              await connection.end();
            }
          }

          configureEphemeralMySql().catch((error) => {
            console.error(`Falha ao preparar MySQL efêmero: ${error.code || 'UNEXPECTED_ERROR'}`);
            process.exit(1);
          });
          NODE
      - name: Verificar sintaxe JavaScript
        run: find . -path './node_modules' -prune -o -path './coverage' -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --experimental-default-type=module --check
      - name: Verificar isolamento estático do banco
        run: npm run db:isolation:verify
      - name: Validar parser, checksums e contrato estrutural de migrations
        run: npm run test:migrations:unit
      - name: Migrar banco efêmero totalmente vazio
        run: npm run db:migrate
      - name: Verificar ledger e checksums
        run: npm run db:migrate:status
      - name: Validar schema final completo
        run: npm run db:schema:validate -- --json
      - name: Provar identidade do MySQL efêmero
        run: npm run db:identity:verify
      - name: Aplicar seed canônico
        run: npm run db:test:seed
      - name: Executar a suíte completa sem retry
        run: |
          mkdir -p ci-results
          npm run lint
          npm test -- --json --outputFile=ci-results/unit.json
          npm run test:integration -- --json --outputFile=ci-results/integration.json
          npm run test:security -- --json --outputFile=ci-results/security.json
          npm run test:migrations:integration -- --json --outputFile=ci-results/migrations.json
          npm run build
      - name: Verificar isolamento de restore com configuração resolvida e sentinelas fictícias
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          RUN_RESTORE_DOCKER_TESTS: '1'
        run: |
          python3 -m unittest discover -s tests/operations -p test_restore_isolation.py -v
          # The fixture transfers its private extracted tree to the app UID (1000).
          # Hosted runners use a different UID; only this synthetic drill needs root.
          sudo env PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 RUN_RESTORE_DOCKER_TESTS=1 \
            GOAL19_EVIDENCE_FILE="$GITHUB_WORKSPACE/ci-results/restore-isolation.json" \
            python3 -m unittest discover -s tests/operations -p test_restore_isolation_docker.py -v
      - name: Instalar browsers e dependências do Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - name: E2E completo Chromium sem retry em MySQL descartável separado
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ci-results/chromium-results.json
        run: npm run test:e2e:all -- --project=chromium --add-reporter=json
      - name: E2E completo Firefox sem retry
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ci-results/firefox-results.json
        run: npm run test:e2e:all -- --project=firefox-critical --add-reporter=json
      - name: E2E completo WebKit sem retry
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ci-results/webkit-results.json
        run: npm run test:e2e:all -- --project=webkit-critical --add-reporter=json
      - name: Preservar evidências dos browsers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.sha }}
          path: |
            ci-results/
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Construir a imagem de produção
        run: docker build --tag plataforma-cursos:ci .
