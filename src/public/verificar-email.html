<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar E-mail - Plataforma de Cursos</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
    <main class="login-main">
        <section class="login-card" aria-labelledby="titulo-verificacao-email">
            <p class="auth-brand">Plataforma de Cursos</p>
            <p class="login-kicker">Ativação de conta</p>
            <h1 id="titulo-verificacao-email">Confirmar e-mail</h1>
            <p class="login-subtitle">
                Digite seu e-mail e o código de 6 dígitos recebido para ativar sua conta.
            </p>

            <!--
                Fluxo desta tela:
                1) Usuário informa e-mail + código
                2) Front chama /api/auth/verificar-codigo-email
                3) Se ok, redireciona para login
            -->
            <form id="form-verificar-email" class="login-form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="codigo">Código de verificação</label>
                    <input type="text" id="codigo" name="codigo" inputmode="numeric" maxlength="6" placeholder="000000" required>
                </div>

                <button type="submit" class="btn-login">Confirmar e-mail</button>
            </form>

            <p id="mensagem-verificacao-email" class="login-message" role="status" aria-live="polite"></p>

            <p class="login-back-link">
                Não recebeu código? <a href="/cadastro.html">Voltar ao cadastro</a>
            </p>
            <p class="login-back-link">
                <a href="/login.html">← Ir para login</a>
            </p>
        </section>
    </main>

    <script type="module" src="/js/verificar-email.js"></script>
</body>
</html>
