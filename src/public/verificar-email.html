<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar E-mail — Plágio</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layouts.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/utilities.css">
</head>
<body class="auth-page auth-page--verify">

<a class="skip-link" href="#conteudo-principal">Pular para o conteúdo</a>

<main class="auth-shell" id="conteudo-principal" tabindex="-1">
<section class="auth-card" aria-labelledby="titulo-verificacao-email">
  <div class="auth-card-header">
    <a class="auth-brand" href="/index.html" aria-label="Plágio — voltar ao catálogo">
      <div class="brand-mark" aria-hidden="true">🧠</div>
      <div>
        <div class="auth-brand-text">Plágio</div>
        <div class="auth-brand-sub">Não Copie Essa Ideia</div>
      </div>
    </a>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Alternar tema">
      <span class="icon-moon" aria-hidden="true">🌙</span>
      <span class="icon-sun" aria-hidden="true">☀️</span>
    </button>
  </div>

  <p class="auth-kicker">Ativação de conta</p>
  <h1 class="auth-title" id="titulo-verificacao-email">Confirmar e-mail</h1>
  <p class="auth-subtitle">
    Digite seu e-mail e o código de 6 dígitos recebido para ativar sua conta.
  </p>

  <form id="form-verificar-email" class="auth-form" aria-busy="false">
    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="voce@email.com" autocomplete="email" required>
    </div>

    <div class="form-group">
      <label for="codigo">Código de verificação</label>
      <input type="text" id="codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required>
    </div>

    <button type="submit" class="btn-submit" data-idle-label="Confirmar e-mail">Confirmar e-mail</button>
  </form>

  <p id="mensagem-verificacao-email" class="auth-message status-message" role="status" aria-live="polite" aria-atomic="true"></p>

  <div class="auth-links">
    <p>Não recebeu o código? <a href="/cadastro.html">Voltar ao cadastro</a></p>
    <p><a href="/login.html">← Ir para login</a></p>
  </div>
</section>
</main>

<script type="module" src="/js/theme.js"></script>
<script type="module" src="/js/verificar-email.js"></script>
</body>
</html>
