<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha — Plágio</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layouts.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/utilities.css">
</head>
<body class="auth-page">
<a class="skip-link" href="#conteudo-principal">Pular para o conteúdo</a>
<main class="auth-shell" id="conteudo-principal" tabindex="-1">
  <section class="auth-card" aria-labelledby="titulo-redefinicao">
    <div class="auth-card-header">
      <a class="auth-brand" href="/index.html" aria-label="Plágio — voltar ao catálogo">
        <img class="brand-mark brand-logo" src="/assets/landing/papagaio-detalhado.webp" width="256" height="256" alt="" aria-hidden="true">
        <span class="auth-brand-text">Plágio</span>
      </a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Alternar tema"><span aria-hidden="true">◐</span></button>
    </div>
    <p class="auth-kicker">Segurança da conta</p>
    <h1 class="auth-title" id="titulo-redefinicao">Criar nova senha</h1>
    <p class="auth-subtitle">O link é temporário e será invalidado depois da alteração.</p>
    <form id="form-redefinicao" class="auth-form" aria-busy="false">
      <div class="form-group">
        <label for="nova_senha">Nova senha</label>
        <input id="nova_senha" name="nova_senha" type="password" minlength="8" autocomplete="new-password" aria-describedby="senha-ajuda" required>
        <small id="senha-ajuda" class="field-help">Use maiúscula, minúscula, número e símbolo.</small>
      </div>
      <div class="form-group">
        <label for="confirmar_senha">Confirme a nova senha</label>
        <input id="confirmar_senha" name="confirmar_senha" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <button class="btn-submit" type="submit" data-idle-label="Redefinir senha">Redefinir senha</button>
    </form>
    <p id="mensagem-redefinicao" class="auth-message status-message" role="status" aria-live="polite"></p>
    <div class="auth-links"><p><a href="/login.html">← Voltar ao login</a></p></div>
  </section>
</main>
<script type="module" src="/js/theme.js"></script>
<script type="module" src="/js/redefinir-senha.js"></script>
</body>
</html>
