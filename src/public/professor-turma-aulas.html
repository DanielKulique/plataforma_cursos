<!DOCTYPE html><html lang="pt-BR"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Aulas e materiais — Plágio</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Work+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/layouts.css"><link rel="stylesheet" href="/css/responsive.css"><link rel="stylesheet" href="/css/utilities.css">
</head><body class="academic-page academic-page--teacher teacher-class-page" data-session-state="loading" data-session-protected data-teacher-section="aulas">
<a class="skip-link" href="#conteudo-principal">Pular para o conteúdo</a><div data-academic-header="teacher" data-current-area="teacher"></div><main class="academic-main" id="conteudo-principal" tabindex="-1"><div id="breadcrumbs"></div><section class="academic-panel course-masthead" aria-labelledby="turma-title"><div><h1 id="turma-title">Carregando turma...</h1><p id="curso-title"></p><p class="course-masthead__meta"><span id="periodo-turma"></span><span id="status-turma" class="badge badge--neutral">Carregando</span></p></div></section><div id="teacher-navigation" class="course-navigation-host"></div>
  <section class="academic-panel" aria-labelledby="titulo-aulas"><header class="academic-panel__header academic-panel__header--actions"><div><h2 id="titulo-aulas">Aulas e materiais</h2><p>A lista mostra apenas a estrutura; os conteúdos ficam dentro de cada aula.</p></div><button id="nova-aula" type="button" class="btn btn-primary" disabled>Nova aula</button></header><p id="mensagem-aulas" class="ui-message is-info" role="status" aria-live="polite">Carregando aulas.</p><ol id="lista-aulas" class="summary-list" aria-busy="true"><li class="ui-state is-loading">Carregando...</li></ol></section>
</main><dialog id="modal-aula" class="academic-dialog" aria-labelledby="titulo-modal-aula"><div class="academic-dialog__header"><h2 id="titulo-modal-aula">Nova aula</h2><button type="button" class="academic-dialog__close" data-close-dialog aria-label="Fechar">×</button></div><p id="erro-modal-aula" class="ui-message is-error" role="alert" aria-live="assertive" hidden></p><form id="form-aula" class="academic-dialog__form"><div class="form-group"><label for="aula-titulo">Título</label><input id="aula-titulo" maxlength="255" required></div><div class="form-group"><label for="aula-descricao">Descrição</label><textarea id="aula-descricao" maxlength="5000" rows="3"></textarea></div><div class="form-group"><label for="aula-ordem">Ordem</label><input id="aula-ordem" type="number" min="0" step="1" required></div><div class="academic-dialog__actions"><button id="salvar-aula" type="submit" class="btn btn-primary">Salvar aula</button><button type="button" class="btn btn-ghost" data-close-dialog>Cancelar</button></div></form></dialog>
<script type="module" src="/js/academic-area.js"></script><script type="module" src="/js/theme.js"></script><script type="module" src="/js/navigation.js"></script><script type="module" src="/js/professor-turma-aulas.js"></script></body></html>
