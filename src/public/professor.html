<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Professor - Plataforma de Cursos</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="catalog-page">
    <header class="site-header">
        <div class="header-top">
            <a href="/index.html" class="brand" aria-label="Plataforma de Cursos">
                <span class="brand-dot" aria-hidden="true"></span>
                <span class="brand-text">Plataforma de Cursos</span>
            </a>
            <nav class="main-nav" aria-label="Navegação do professor">
                <a href="/index.html" class="nav-link">Catálogo</a>
                <a href="/sala-virtual.html" class="nav-link" id="link-sala" hidden>Sala virtual</a>
                <button id="btn-logout" type="button">Sair</button>
            </nav>
        </div>

        <section class="hero-card" aria-labelledby="professor-title">
            <p class="hero-tag">Área do Professor</p>
            <h1 id="professor-title">Dashboard de Turmas</h1>
            <p class="hero-description">
                Gerencie suas turmas, visualize alunos matriculados e acompanhe o progresso.
            </p>
        </section>

        <div class="status-bar">
            <p id="status-usuario">Carregando usuário...</p>
            <p id="mensagem-professor" class="sala-message"></p>
        </div>
    </header>

    <main class="catalog-main">
        <section class="panel panel-full">
            <div class="panel-heading">
                <h2>Minhas Turmas</h2>
                <p>Gerencie as turmas sob sua responsabilidade.</p>
            </div>
            <ul id="lista-minhas-turmas" class="card-list"></ul>
        </section>
    </main>

    <script type="module" src="/js/professor.js"></script>
</body>
</html>
