name: CI
on:
  push:
    branches: ['**']
    # The RC tag seals the already-tested SHA; do not start a second full CI.
    tags-ignore: ['goal22-rc.*']
  pull_request:
permissions:
  contents: read
jobs:
  webkit-responsive:
    if: github.ref == 'refs/heads/release/goal22-canonical-rc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Instalar somente WebKit
        run: npx playwright install --with-deps webkit
      - name: WebKit responsivo direcionado sem retry em infraestrutura descartável
        shell: bash
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ci-results/targeted-webkit.json
        run: |
          mkdir -p ci-results
          npm run test:e2e:all -- tests/e2e/responsive-roles.spec.js --project=webkit-critical --add-reporter=json 2>&1 | tee ci-results/targeted-webkit.log
      - name: Confirmar um teste e as 78 combinações sem skips ou retries
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const report = require('./ci-results/targeted-webkit.json');
          assert.equal(report.stats.expected, 1);
          for (const key of ['unexpected', 'skipped', 'flaky']) assert.equal(report.stats[key], 0);
          const tests = [];
          function collect(suite) {
            for (const spec of suite.specs || []) tests.push(...spec.tests);
            for (const child of suite.suites || []) collect(child);
          }
          report.suites.forEach(collect);
          assert.equal(tests.length, 1);
          assert.equal(tests[0].projectName, 'webkit-critical');
          assert.equal(tests[0].status, 'expected');
          assert.equal(tests[0].results.length, 1);
          const result = tests[0].results[0];
          assert.equal(result.status, 'passed');
          assert.equal(result.retry, 0);
          assert.equal(result.steps.length, 13);
          assert.equal(new Set(result.steps.map(step => step.title)).size, 13);
          const roles = { aluno: 0, professor: 0, admin: 0 };
          for (const screen of result.steps) {
            roles[screen.title.split(' ')[0]] += 1;
            assert.deepEqual(screen.steps.map(step => step.title), ['320px', '360px', '390px', '412px', '768px', '1440px']);
          }
          assert.deepEqual(roles, { aluno: 7, professor: 5, admin: 1 });
          console.log('PASS: one WebKit test, 13 screens × 6 viewports, zero retries/skips/flaky.');
          NODE
      - name: Preservar trace screenshots e logs do teste direcionado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goal22-targeted-webkit-${{ github.sha }}
          path: |
            ci-results/
            playwright-report/
            test-results/
          if-no-files-found: warn
  testes:
    needs: webkit-responsive
    # Outside the canonical release branch the existing full CI remains unchanged.
    if: ${{ !cancelled() && (needs.webkit-responsive.result == 'success' || needs.webkit-responsive.result == 'skipped') }}
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: plataforma_cursos_test
          MYSQL_USER: appuser
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports: ['33307:3306']
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 33307
      DB_USER: appuser
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      DB_NAME: plataforma_cursos_test
      DB_ENVIRONMENT_IDENTITY: plataforma_cursos_test
      ALLOW_EPHEMERAL_CI_MYSQL: I_UNDERSTAND_EPHEMERAL_CI_MYSQL
      CI_EPHEMERAL_MYSQL_ID: plataforma-cursos-ci-${{ github.run_id }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      TEST_SEED_PASSWORD: ${{ secrets.CI_TEST_SEED_PASSWORD }}
      MOTOR_IA_INTERNAL_API_TOKEN: ci-ephemeral-internal-token
      MOTOR_IA_API_URL: http://127.0.0.1:8000
      DETECTOR_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Aguardar MySQL
        run: |
          node <<'NODE'
          const mysql = require('mysql2/promise');

          async function waitForMySql() {
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              try {
                const connection = await mysql.createConnection({
                  host: process.env.DB_HOST,
                  port: Number(process.env.DB_PORT),
                  user: process.env.DB_USER,
                  password: process.env.DB_PASSWORD
                });
                await connection.end();
                return;
              } catch (error) {
                if (attempt === 30) {
                  throw error;
                }
                await new Promise((resolve) => setTimeout(resolve, 2000));
              }
            }
          }

          waitForMySql().catch((error) => {
            console.error(`MySQL não ficou disponível: ${error.code || 'UNEXPECTED_ERROR'}`);
            process.exit(1);
          });
          NODE
      - name: Habilitar triggers no MySQL efêmero
        env:
          DB_USER: root
          DB_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
        run: |
          node <<'NODE'
          const mysql = require('mysql2/promise');

          async function configureEphemeralMySql() {
            const connection = await mysql.createConnection({
              host: process.env.DB_HOST,
              port: Number(process.env.DB_PORT),
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD
            });
            try {
              await connection.query('SET GLOBAL log_bin_trust_function_creators = 1');
              // Only this disposable CI account observes lock waits in concurrency tests.
              await connection.query("GRANT SELECT ON performance_schema.data_lock_waits TO 'appuser'@'%'");
            } finally {
              await connection.end();
            }
          }

          configureEphemeralMySql().catch((error) => {
            console.error(`Falha ao preparar MySQL efêmero: ${error.code || 'UNEXPECTED_ERROR'}`);
            process.exit(1);
          });
          NODE
      - name: Verificar sintaxe JavaScript
        run: find . -path './node_modules' -prune -o -path './coverage' -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --experimental-default-type=module --check
      - name: Verificar isolamento estático do banco
        run: npm run db:isolation:verify
      - name: Validar parser, checksums e contrato estrutural de migrations
        run: npm run test:migrations:unit
      - name: Migrar banco efêmero totalmente vazio
        run: npm run db:migrate
      - name: Verificar ledger e checksums
        run: npm run db:migrate:status
      - name: Validar schema final completo
        run: npm run db:schema:validate -- --json
      - name: Provar identidade do MySQL efêmero
        run: npm run db:identity:verify
      - name: Aplicar seed canônico
        run: npm run db:test:seed
      - name: Executar a suíte completa sem retry
        run: |
          mkdir -p ci-results
          npm run lint
          npm test -- --json --outputFile=ci-results/unit.json
          npm run test:integration -- --json --outputFile=ci-results/integration.json
          npm run test:security -- --json --outputFile=ci-results/security.json
          npm run test:migrations:integration -- --json --outputFile=ci-results/migrations.json
          npm run build
      - name: Verificar isolamento de restore com configuração resolvida e sentinelas fictícias
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          RUN_RESTORE_DOCKER_TESTS: '1'
        run: |
          python3 -m unittest discover -s tests/operations -p test_restore_isolation.py -v
          # The fixture transfers its private extracted tree to the app UID (1000).
          # Hosted runners use a different UID; only this synthetic drill needs root.
          sudo env PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 RUN_RESTORE_DOCKER_TESTS=1 \
            GOAL19_EVIDENCE_FILE="$GITHUB_WORKSPACE/ci-results/restore-isolation.json" \
            python3 -m unittest discover -s tests/operations -p test_restore_isolation_docker.py -v
      - name: Validar documentação atual
        run: python3 docs/engineering/validate_current_docs.py
      - name: Smokes acadêmicos em laboratório Docker descartável
        run: python3 -u tests/operations/run_academic_smokes.py --allow-lab-writes 2>&1 | tee ci-results/academic-smokes.log
      - name: Construir a imagem de produção
        run: docker build --build-arg APP_RELEASE_SHA="$GITHUB_SHA" --tag plataforma-cursos:ci . 2>&1 | tee ci-results/docker-build.log
      - name: Validar recuperação de certificados na imagem com dados sintéticos
        run: python3 -u tests/operations/test_certificate_recovery_runtime.py --image plataforma-cursos:ci --allow-lab-apply 2>&1 | tee ci-results/certificate-recovery-runtime.log
      - name: Configurar diretório isolado do Playwright
        shell: bash
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Instalar browsers e dependências do Playwright
        timeout-minutes: 10
        shell: bash
        env:
          DEBUG: pw:install
        run: |
          set -Eeuo pipefail
          mkdir -p ci-results
          exec > >(tee ci-results/playwright-install.log) 2>&1
          trap 'status=$?; date -u; echo "Playwright installation exit=$status"; ps -eo pid,ppid,stat,etime,comm; exit "$status"' EXIT
          date -u
          cat /etc/os-release
          node --version
          ./node_modules/.bin/playwright --version
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const lock = require('./package-lock.json');
          const version = require('@playwright/test/package.json').version;
          for (const name of ['@playwright/test', 'playwright', 'playwright-core']) {
            assert.equal(require(`${name}/package.json`).version, version);
            assert.equal(lock.packages[`node_modules/${name}`].version, version);
          }
          const manifest = JSON.parse(fs.readFileSync(path.join(path.dirname(require.resolve('playwright-core/package.json')), 'browsers.json')));
          console.log(JSON.stringify({ version, browsers: manifest.browsers.filter(b => ['chromium', 'firefox', 'webkit'].includes(b.name)), freshPath: process.env.PLAYWRIGHT_BROWSERS_PATH }));
          NODE
          echo '::group::APT dependencies (maximum 5 minutes)'
          # The previous runner stalled acquiring indexes from the Azure mirror.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$source" ]]; then
              sudo -n sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
              echo "APT source: $source"
              cat "$source"
            fi
          done
          printf '%s\n' 'Acquire::Retries "0";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'APT::Update::Error-Mode "any";' | sudo -n tee /etc/apt/apt.conf.d/99-playwright-ci
          sudo -n timeout --signal=TERM --kill-after=10s 5m env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a "$(command -v node)" ./node_modules/playwright/cli.js install-deps chromium firefox webkit
          echo '::endgroup::'
          echo '::group::Browser downloads (maximum 4 minutes)'
          ./node_modules/.bin/playwright install --dry-run chromium firefox webkit
          timeout --signal=TERM --kill-after=10s 4m ./node_modules/.bin/playwright install chromium firefox webkit
          node <<'NODE'
          const fs = require('node:fs');
          const playwright = require('playwright');
          for (const name of ['chromium', 'firefox', 'webkit']) {
            const executable = playwright[name].executablePath();
            fs.accessSync(executable, fs.constants.X_OK);
            console.log(`${name}: executable verified at ${executable}`);
          }
          NODE
          echo '::endgroup::'
      - name: E2E completo Chromium sem retry em MySQL descartável separado
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ci-results/chromium-results.json
        run: npm run test:e2e:all -- --project=chromium --add-reporter=json
      - name: E2E completo Firefox sem retry
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ci-results/firefox-results.json
        run: npm run test:e2e:all -- --project=firefox-critical --add-reporter=json
      - name: E2E completo WebKit sem retry
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ci-results/webkit-results.json
        run: npm run test:e2e:all -- --project=webkit-critical --add-reporter=json
      - name: Preservar evidências dos browsers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.sha }}
          path: |
            ci-results/
            playwright-report/
            test-results/
          if-no-files-found: ignore
